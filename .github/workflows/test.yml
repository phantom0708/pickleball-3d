name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Cài thư viện
        run: cd server && npm ci
      - name: Kiểm tra cú pháp
        run: for f in shared/*.js js/*.js server/*.js server/test/*.js; do node --check "$f"; done
      - name: Chạy test (luật, vật lý, online)
        run: cd server && npm test
